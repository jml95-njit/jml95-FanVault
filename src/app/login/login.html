<div class="auth-container">
  <div class="auth-box">
    <h2>FanVault Login</h2>

    <div *ngIf="!requireMFA">
      <input type="text" [(ngModel)]="username" placeholder="Username" class="input-field">
      <input type="password" [(ngModel)]="password" placeholder="Password" class="input-field">
      <button (click)="onLogin()" class="btn">Log In</button>
      <p *ngIf="errorMessage" style="color: #ff4d4d;">{{ errorMessage }}</p>
      <p>New here? <a routerLink="/register">Create an account</a></p>
    </div>

    <div *ngIf="requireMFA" style="text-align: center;">
      <h3>Two-Factor Authentication</h3>
      <p style="margin-bottom: 20px;">Open your Authenticator app and enter the 6-digit code for <strong>{{username}}</strong>.</p>
      <input type="text" [(ngModel)]="mfaCode" placeholder="000000" maxlength="6" class="input-field" style="text-align: center; font-size: 24px; letter-spacing: 5px;">
      <button (click)="onLogin()" class="btn" style="background-color: #00a0ff;">Verify</button>
      <p *ngIf="errorMessage" style="color: #ff4d4d; margin-top: 15px;">{{ errorMessage }}</p>
    </div>

  </div>
</div>
