<div class="auth-container">
  <div class="auth-box">
    <h2>Join FanVault</h2>

    <div *ngIf="!qrCodeUrl">
      <input type="text" [(ngModel)]="username" placeholder="Username" class="input-field">
      <input type="password" [(ngModel)]="password" placeholder="Password" class="input-field">
      <button (click)="onRegister()" class="btn">Sign Up</button>
      <p *ngIf="errorMessage" style="color: #ff4d4d;">{{ errorMessage }}</p>
      <p>Already a fan? <a routerLink="/login">Log in here</a></p>
    </div>

    <div *ngIf="qrCodeUrl" style="text-align: center;">
      <h3 style="color: #28a745;">Registration Successful!</h3>
      <p>Scan this barcode with <strong>Google Authenticator</strong> or <strong>Duo Mobile</strong> to secure your account.</p>
      <img [src]="qrCodeUrl" alt="MFA QR Code" style="margin: 20px 0; border: 5px solid white; border-radius: 10px;">
      <p style="font-size: 14px; color: #ccc;">Once scanned, proceed to login to test your 6-digit code.</p>
      <button routerLink="/login" class="btn">Proceed to Login</button>
    </div>

  </div>
</div>
